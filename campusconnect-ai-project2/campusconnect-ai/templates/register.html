{% extends "base.html" %}{% block title %}Register{% endblock %}
{% block content %}<div class="card" style="max-width:420px;margin:auto"><h1>Student registration</h1>
<form method="post"><input type="hidden" name="_csrf" value="{{ csrf_token }}">
<label>Name</label><input name="name" required>
<label>Email</label><input name="email" type="email" required>
<label>Password (min 8 characters)</label><input name="password" type="password" minlength="8" required>
<p><button class="btn">Create account</button></p></form></div>{% endblock %}
