{% extends "base.html" %}{% block title %}Log in{% endblock %}
{% block content %}<div class="card" style="max-width:420px;margin:auto"><h1>Log in</h1>
<form method="post"><input type="hidden" name="_csrf" value="{{ csrf_token }}">
<label>Email</label><input name="email" type="email" required autofocus>
<label>Password</label><input name="password" type="password" required>
<p><button class="btn">Log in</button></p></form>
<p class="muted">New student? <a href="{{ url_for('register') }}">Create an account</a></p></div>{% endblock %}
