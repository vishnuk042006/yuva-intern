services:
  app:
    image: ${IMAGE:-expense-tracker:latest}
    environment:
      APP_ENV: production
      API_KEY: ${API_KEY}
      LOG_LEVEL: INFO
    ports: ["8000:8000"]
    volumes: ["prod-data:/data"]
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}
volumes:
  prod-data:
